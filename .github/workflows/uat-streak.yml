# UAT realistic streak — nightly smoke trên production URL.
name: UAT streak

on:
  schedule:
    # 01:00 ICT (18:00 UTC previous day)
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      streak_target:
        description: "Số kịch bản liên tiếp (mặc định 15)"
        required: false
        default: "15"

concurrency:
  group: uat-streak
  cancel-in-progress: false

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: UAT realistic streak
        run: node scripts/uat-realistic-streak.mjs
        env:
          STREAK_TARGET: ${{ github.event.inputs.streak_target || '15' }}
          UAT_BASE_URL: https://bhxh.orangecloud.vn
