# Vitest + Playwright (Postgres service) trên PR và push main.
name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Vitest
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vn_insurance_fti_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vn_insurance_fti_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Prepare .env.e2e
        run: cp .env.e2e.example .env.e2e

      - name: QA setup (schema + seed)
        run: pnpm qa:setup
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vn_insurance_fti_qa?schema=public

      - name: Playwright E2E
        run: pnpm test:e2e --project=chromium
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vn_insurance_fti_qa?schema=public

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/test-results.json
            playwright-report/
