# Deploy Next.js (OpenNext) lên Cloudflare Workers.
# Secrets repo: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Tuỳ chọn: HR_CONTACT_EMAIL, HR_EMAIL_FROM, CRON_WORKER_BASE_URL, WRANGLER_* binding overrides.

name: Deploy Cloudflare Workers

on:
  workflow_dispatch: {}
  push:
    branches: [main]

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate wrangler.local.jsonc
        run: node scripts/generate-wrangler-local.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRON_WORKER_BASE_URL: https://vn-insurance-fti.sycu-lee.workers.dev
          HR_CONTACT_EMAIL: ${{ vars.HR_CONTACT_EMAIL }}
          HR_EMAIL_FROM: ${{ vars.HR_EMAIL_FROM }}

      - name: Deploy (OpenNext + Wrangler)
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
