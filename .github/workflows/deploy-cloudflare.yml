# Deploy Next.js (OpenNext) lên Cloudflare Workers.
# Secrets repo: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Tuỳ chọn: HR_CONTACT_EMAIL, HR_EMAIL_FROM, CRON_WORKER_BASE_URL, WRANGLER_* binding overrides.

name: Deploy Cloudflare Workers

on:
  workflow_dispatch: {}
  push:
    branches: [main]

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate wrangler.local.jsonc
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] && [ -n "${CLOUDFLARE_API_TOKEN}" ]; then
            CLOUDFLARE_ACCOUNT_ID=$(curl -fsS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);if(!j.success||!j.result?.[0]?.id){console.error('Could not resolve Cloudflare account ID');process.exit(1)};process.stdout.write(j.result[0].id)})")
            export CLOUDFLARE_ACCOUNT_ID
          fi
          node scripts/generate-wrangler-local.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRON_WORKER_BASE_URL: https://bhxh.orangecloud.vn
          HR_CONTACT_EMAIL: ${{ vars.HR_CONTACT_EMAIL }}
          HR_EMAIL_FROM: ${{ vars.HR_EMAIL_FROM }}

      - name: Deploy (OpenNext + Wrangler)
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
